services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    # tmpfs avoids WiredTiger crashes on some Colima/virtio volume setups
    tmpfs:
      - /data/db:rw,size=512m

  policy:
    build:
      context: ../services/policy
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      POLICY_DEFAULTS_PATH: /config/default-policy.json
    volumes:
      - ../services/policy/config:/config:ro

  vault:
    build:
      context: ../services/vault
    ports:
      - "8100:8100"
    environment:
      PORT: "8100"
      VAULT_TOKEN: local-vault-token
      # Demo keys stay in the vault process only (not the API).
      EVM_DEMO_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

  api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MONGODB_URI: mongodb://mongo:27017/guardrail
      JWT_ACCESS_SECRET: local-access-secret
      JWT_REFRESH_SECRET: local-refresh-secret
      POLICY_SERVICE_URL: http://policy:8090
      VAULT_URL: http://vault:8100
      VAULT_TOKEN: local-vault-token
      EVM_RPC_URL: http://anvil:8545
      SOLANA_RPC_URL: http://solana:8899
      PLANNER: mock
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://guardrail-agent-six.vercel.app}
      SIWE_DOMAIN: ${SIWE_DOMAIN:-guardrail-agent-six.vercel.app}
      SIWE_URI: ${SIWE_URI:-https://guardrail-agent-six.vercel.app}
      SIWE_CHAIN_ID: "31337"
    depends_on:
      - mongo
      - policy
      - vault

  web:
    build:
      context: ../apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337"]
    ports:
      - "8545:8545"
    profiles: ["full"]

  solana:
    image: solanalabs/solana:v1.18.26
    command: ["solana-test-validator", "--bind-address", "0.0.0.0", "--rpc-port", "8899", "--ledger", "/data/ledger", "--reset"]
    ports:
      - "8899:8899"
    profiles: ["full"]
